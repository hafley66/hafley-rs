name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: install just
        # `boop-start` warm-up is a just recipe, and the tests that pin it
        # assert `just` is on PATH rather than skipping themselves.
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: test workspace
        run: cargo test --workspace --locked

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: boop packages that exist at the baseline
        id: baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A semver check compares two sides. A crate this PR adds has no
          # baseline, and naming it errors the whole run, so the list is every
          # boop crate git can already find at BASE. A new crate joins the list
          # by itself on the PR after the one that adds it; nothing to edit.
          packages=""
          for manifest in crates/boop*/Cargo.toml; do
            name=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -1)
            if git cat-file -e "$BASE:$manifest" 2>/dev/null; then
              packages="${packages:+$packages, }$name"
            else
              echo "no baseline at $BASE, skipped: $name"
            fi
          done
          echo "checking: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: check public api compatibility
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ${{ steps.baseline.outputs.packages }}
          baseline-rev: ${{ github.event.pull_request.base.sha }}
