[workspace]
members = ["crates/*", "crates/sprefa-extract/tree-sitter-dl6"]
resolver = "2"
# ghcache and ghcache-client resolve their own sqlite stacks (sqlx vs boop's
# rusqlite). One lockfile cannot hold two libsqlite3-sys versions, so they
# build as standalone crates in place; excluded dirs are their own workspace
# roots even under a parent [workspace]. sprefa-extract resolves its own
# lockfile too, decoupled from the boop/soopy dependency graph.
exclude = ["crates/ghcache", "crates/ghcache-client", "crates/sprefa-extract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hafley66/hafley-rs"
homepage = "https://github.com/hafley66/hafley-rs"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# A dependency is compiled once per lockfile and then only ever run, so the
# test suite pays its unoptimized speed on every run for no edit-loop gain.
# Workspace members stay at opt-level 0; an edit has to rebuild them.
[profile.dev.package."*"]
opt-level = 1

[profile.dist]
inherits = "release"
lto = "thin"
