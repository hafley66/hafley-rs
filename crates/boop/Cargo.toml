[package]
name = "boop"
version = "0.0.2"
edition.workspace = true
description = "cross-harness agent transcript reader: tail agent events from every harness on this machine as one stream"
license.workspace = true

[features]
# Transcript reading and its store-facing read surface: the query, usage, and
# chat-repr modules. Default on; `--no-default-features` keeps the lane/bus/mux
# verbs with no transcript reader in the graph.
default = ["agent-read"]
agent-read = []

[dependencies]
# The tmux multiplexer seam: one trait, one implementation, in its own crate.
boop-mux = { version = "0.0.2", path = "../boop-mux" }
# clap derive gives the self-describing --help, subcommand help, and shell
# completions this CLI exists to have. Chosen by the user (build-vs-buy, fixed).
clap = { version = "4", features = ["derive"] }
# The transcripts are JSONL; this is the credible reader.
serde = { version = "1", features = ["derive"] }
# preserve_order: a row's column order is its SELECT order, so `--format text`
# has one column order per kind defined where the query is, never a second list.
serde_json = { version = "1", features = ["preserve_order"] }
# Application-level errors; this is a binary, not a library API.
anyhow = "1"
# Resolve the claude home dir without XDG project-dir machinery.
dirs = "5"
# Walk ~/.claude/projects/{encoded-cwd}/*.jsonl; can skip subtrees.
walkdir = "2"
# Layer 0: process tree, cpu, rss, cwd in one cross-platform API.
sysinfo = "0.39"
# Layer 3: the SQLite store at ~/.agent/boop.db. `bundled` compiles SQLite in,
# so no system SQLite version can disagree with it. Applies the repo's
# surrogate-key law (interning natural TEXT keys to INTEGER ids).
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
# Transcript timestamps parse against Rfc3339; hand-rolled date math is gone.
time = { version = "0.3", features = ["parsing", "formatting"] }
# Process-wide diagnostics. The binary installs the subscriber; library code
# only emits conventional tracing events and spans.
tracing.workspace = true
tracing-subscriber.workspace = true
# Signal delivery off the handler. A lane pane is killed with SIGHUP/SIGTERM and
# the supervisor must still write its result row, which means allocating and
# opening a file: work no async-signal-safe handler may do. signal-hook's
# handler only writes a self-pipe byte and the work runs on a normal thread.
signal-hook = "0.4"

[dev-dependencies]
# Peak-bytes-allocated counter for tests/bench_grid.rs's own #[global_allocator].
peak_alloc = "0.3"

[lib]
name = "boop"
path = "src/lib.rs"

[[bin]]
name = "boop"
path = "src/main.rs"

# The two examples are store views; agent-read only.
[[example]]
name = "instant_views"
required-features = ["agent-read"]

[[example]]
name = "typed_rows"
required-features = ["agent-read"]
