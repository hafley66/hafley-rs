[package]
name = "boop"
version = "0.0.9"
autotests = false
edition.workspace = true
description = "cross-harness agent transcript reader: tail agent events from every harness on this machine as one stream"
license.workspace = true

[features]
# Transcript reading and its store-facing read surface: the query, usage, and
# chat-repr modules. Default on; `--no-default-features` keeps the lane/bus/mux
# verbs with no transcript reader in the graph.
default = ["agent-read"]
agent-read = ["boop-store/agent-read", "boop-proc/agent-read"]
# The DL6 refinement runtime (`concatmap`, `host`): off by default per the
# 2026-08-25 user call, no other binary to move it to yet.
dl6 = []

[dependencies]
# Process control: lane spawn, supervision, the mailbox, the coroutine host.
boop-proc = { version = "0.0.2", path = "../boop-proc", default-features = false }
# The per-harness transcript formats, identity ladder and spawn worktree.
boop-harness = { version = "0.0.2", path = "../boop-harness" }
# The lane channel: the ACP client and the tmux TUI driver.
boop-acp = { version = "0.0.2", path = "../boop-acp" }
# The database: schema, migrations, transcript projection, typed queries.
boop-store = { version = "0.0.2", path = "../boop-store", default-features = false, features = ["clap"] }
# clap derive gives the self-describing --help, subcommand help, and shell
# completions this CLI exists to have. Chosen by the user (build-vs-buy, fixed).
clap = { version = "4", features = ["derive"] }
# `--format json` output and the typed rows the verbs print.
serde = { version = "1", features = ["derive"] }
# preserve_order: a row's column order is its SELECT order, so `--format text`
# has one column order per kind defined where the query is, never a second list.
serde_json = { version = "1", features = ["preserve_order"] }
# Application-level errors; this is a binary, not a library API.
anyhow = "1"
# Resolve the caller's home dir without XDG project-dir machinery.
dirs = "5"
# The `db` verb binds caller SQL to the store's connection; the passthrough
# is the whole point of the verb.
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
# An opencode door address is a base URL; `mail.rs` reads one back out of the
# two agent_live columns as the same `url::Url` the harness handed over.
url = "2"
# `cli/job.rs` parses transcript timestamps against Rfc3339; hand-rolled date
# math is gone.
time = { version = "0.3", features = ["parsing", "formatting"] }
# Process-wide diagnostics. The binary installs the subscriber; library code
# only emits conventional tracing events and spans.
tracing.workspace = true
tracing-subscriber.workspace = true
hafley-observe = { path = "../hafley-observe" }

[dev-dependencies]
# Deadline on a synchronous std::process::Child in tests/0_sqlite_contention.rs
# without pulling in an async runtime.
wait-timeout = "0.2.1"
# The store's deterministic fixtures (throwaway git repo, fake multiplexer).
boop-store = { version = "0.0.2", path = "../boop-store", features = ["testing"] }
# Peak-bytes-allocated counter for tests/bench_grid.rs's own #[global_allocator].
peak_alloc = "0.3"

[lib]
name = "boop"
path = "src/lib.rs"

[[bin]]
name = "boop"
path = "src/main.rs"

# The two examples are store views; agent-read only.
[[example]]
name = "instant_views"
required-features = ["agent-read"]

[[example]]
name = "typed_rows"
required-features = ["agent-read"]

# One integration target; every tests/*.rs is a module of tests/main.rs.
# The two DL6 modules are gated there on the `dl6` feature.
[[test]]
name = "main"
path = "tests/main.rs"
