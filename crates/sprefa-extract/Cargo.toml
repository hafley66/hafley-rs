[package]
name = "sprefa-extract"
version = "0.1.0"
edition = "2021"
build = "build.rs"
autotests = false
description = "v6 extraction leaf: a corpus at a version -> normalized graph facts. Sync, rayon-parallel, arena-mastered. No DB, no async."
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/hafley66/hafley-rs"
homepage = "https://github.com/hafley66/hafley-rs"

# publish=false keeps crates.io out; dist=true opts into cargo-dist releases
# (tag sprefa-extract-vX.Y.Z), same shell-installer flow as sprefa-dl. The
# config is crates/sprefa-extract/dist-workspace.toml and the flow is the
# repository-root .github/workflows/release.yml (hand-patched: this crate is
# excluded from the root workspace, so every CI step runs in this directory).
[package.metadata.dist]
dist = true
features = ["cli"]

# Own workspace root: without this table a git worktree under .claude/worktrees/
# walks up past the parent's `exclude` and fails to resolve. Railed by tests/112_build_metadata.rs.
[workspace]

[build-dependencies]
hafley_scm = { path = "../hafley_scm", default-features = false, optional = true }
tree-sitter = "0.27"
tree-sitter-kotlin-sg = { version = "0.4", optional = true }

[dependencies]
ryi-proto = { path = "../ryi-proto", optional = true }
# The newline scan behind the per-document line table. Already unified in the
# workspace lock through regex/aho-corasick, so this pins no new copy.
memchr = { version = "2", optional = true }
# @comment-ok: build-vs-buy candidate table, the law every dep comment here carries.
# The directory walker soopy itself uses (`soopy/src/_3a_files.rs:6`), already in
# this lock, so the pin adds no copy. soopy's own
# `DirectoryRoot::snapshot` hashes every file it visits, which a path-only move
# corpus scan must not pay; `walkdir` is `ignore`'s own dependency with no
# filter_entry-by-name convenience. The move corpus walk is the one caller.
ignore = { version = "0.4", optional = true }
globset = { version = "0.4", optional = true }
# oxc arena AST front-end for TS/JS (v5 carried these; src/graph/typegraph/ts).
# The Program<'a> borrows the Allocator + source text, so parse ties content to
# 'a (the GAT seam). Commit 2b: TypeF entities; commit 2c: the arrow-type sigs
# (oxc_ast_visit walks type annotations for the named references they reference).
oxc_allocator = { version = "0.151", optional = true }
oxc_parser = { version = "0.151", optional = true }
oxc_ast = { version = "0.151", optional = true }
oxc_ast_visit = { version = "0.151", optional = true }
oxc_span = { version = "0.151", optional = true }
oxc_syntax = { version = "0.151", optional = true }
# The exact identifier spans `extract rename` needs. Default features empty; +1
# crate, candidates measured in plans/2026-08-27-extract-rename.PLAN.md:222-251.
oxc_semantic = { version = "0.151", optional = true }
# @comment-ok: build-vs-buy candidate table, the law every dep comment here carries.
# The ESM/CJS + tsconfig resolution algorithm the `move` verb needs: extension
# aliases (`./x.js` naming `x.ts`), `index`, package `exports`/`main`, tsconfig
# `paths`/`baseUrl`/`extends`/`references`. Same oxc project family; the
# alternatives measured are in `lang/ts_resolve.rs` and the arc-3 plan table
# (swc's resolver is not a standalone crate; the `tsconfig` crates parse config
# without resolving; a hand-rolled probe re-derives a tested algorithm).
oxc_resolver = { version = "11.24.3", optional = true }
# syn is the Rust AST front-end v5 carried (src/graph/typegraph/rust). The
# `full` feature parses Item::*; `visit` drives the call-site/call-def walks;
# `extra-traits` for derive Eq on AST nodes some helpers pattern-match. Ported
# verbatim, not relitigated. Line/col on spans lives on proc_macro2::Span
# (syn 2 dropped its `span-locations` feature), gated by proc-macro2's
# `span-locations`; v6 Span is byte offsets, bridged by the line_starts table
# in lang/rust.rs.
syn = { version = "3", features = ["full", "visit", "parsing", "extra-traits"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
# ra_ap_syntax and salsa remain for the optional rust checker tier.
ra_ap_syntax = { version = "0.0.352", optional = true }
salsa = { version = "0.28.2", default-features = false, features = ["macros", "rayon"], optional = true }
# @comment-ok: build-vs-buy candidate table, the law every dep comment here carries.
# The rust CHECKER tier: rust-analyzer's own name resolution and type inference,
# in-process, same pins as the expander above. `load-cargo` reads `cargo
# metadata` (never a build) into a salsa db; `hir` answers a method call's
# receiver type and a path's def; `ide_db`/`vfs` carry the file ids the answers
# name. REJECTED: a bespoke trait solver or inference pass (the standing
# build-vs-buy law, and rustc's own solver is the thing being asked); `rustc_*`
# via rustc-dev (nightly-only, unstable ABI, no semver); running `rust-analyzer
# scip` as a subprocess (measured already as `rust.scip_override.call.tsv`, and
# it re-parses instead of sharing this crate's arena).
ra_ap_hir = { version = "0.0.352", optional = true }
ra_ap_ide = { version = "0.0.352", optional = true }
ra_ap_ide_db = { version = "0.0.352", optional = true }
ra_ap_load-cargo = { version = "0.0.352", optional = true }
ra_ap_project_model = { version = "0.0.352", optional = true }
ra_ap_vfs = { version = "0.0.352", optional = true }
# tree-sitter is the Go AST front-end v5 carried (src/graph/typegraph/go.rs).
# Byte-identical with the versions this lock already carried when they became
# direct, so the lock did not move: one copy each. The same story holds for the
# other grammar crates below. tree-sitter-go 0.25 exports `LANGUAGE: LanguageFn`,
# which
# tree-sitter 0.27's `Language::new` wraps (v5's exact `go_parse` shape). Byte
# spans come straight off the nodes (`start_byte`/`end_byte`); no line/col bridge.
tree-sitter = "0.27"
tree-sitter-go = { version = "0.25", optional = true }
# tree-sitter-python is the Python front-end v5 carried; already in the lock
# when it became direct, so cargo unifies it: one copy, no dupe.
tree-sitter-python = { version = "0.25", optional = true }
# tree-sitter-kotlin-sg is the Kotlin AST front-end v5 carried
# (src/graph/typegraph/kotlin.rs; root Cargo.toml pins the same crate, so the v6
# parse is byte-identical to the v5 oracle's). It is ALREADY in this lock as an
# (0.4.1), exports `LANGUAGE: LanguageFn` like tree-sitter-go 0.25, and deps
# only `tree-sitter-language` + `cc` (no
# tree-sitter core): cargo UNIFIES it, one copy, no dupes.
tree-sitter-kotlin-sg = { version = "0.4", optional = true }
# MIT superset grammar for ISO Prolog plus the SWI/DCG/ProbLog syntax used by
# v6/prolog. ABI 14 and LanguageFn match the tree-sitter 0.27 runtime above.
tree-sitter-prolog = { version = "0.1", optional = true }
# The `data` family's three grammars, v5's `src/datapath.rs` plane ported.
# yaml/toml-ng match sprefa's pins. JSON uses the same grammar release as sprefa.
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
# tree-sitter-md is the markdown front-end v5 carries (root Cargo.toml:116,
# src/cst.rs + src/ingest/mod.rs). LANGUAGE = block, INLINE_LANGUAGE = inline.

# Block parse is byte-identical to the v5 oracle's; default-features-0 deps
# only tree-sitter-language, pairing with the 0.27 runtime.

# `md` exposes LANGUAGE, `md_inline` INLINE_LANGUAGE; both drop in unchanged.
tree-sitter-md = { version = "0.5", optional = true }
# tree-sitter-html is the html front-end (the FallbackSource grammar); already
# in the lock when it became direct, so cargo UNIFIES one copy, no new
# tree-sitter.
tree-sitter-html = { version = "0.23", optional = true }
# tree-sitter-gdscript is the GDScript front-end (Godot's `.gd`). Adjudication
# against THIS lock: tree-sitter-gdscript 6.1.0, +1 crate, deps only
# tree-sitter-language + cc (no tree-sitter core). Nothing cheaper exists:
# (lib.rs:240-263), so the cst-only FallbackSource cannot take the extension. ABI 14, inside the 13..=15 window tree-sitter 0.27 accepts
# (lib.rs:663-668), and it exports `LANGUAGE: LanguageFn` like tree-sitter-go.
tree-sitter-gdscript = { version = "6", optional = true }
# tree-sitter-commonlisp is the Lisp front-end. Candidates measured against this
# lock: tree-sitter-commonlisp 0.4.1, +1 crate, tree-sitter-language + cc, ABI
# 14 (the one taken); tree-sitter-scheme 0.24.7 (same shape; a second lisp
# dialect, not this increment); REJECTED tree-sitter-clojure 0.1.0 (an
# edition-2024 third-party repackage carrying a tree-sitter core edge, i.e. a
# second core copy) and tree-sitter-elisp 1.7.2 (Lisp-2, self-documented as
# s-expressions only: the lowest extraction value of the four). It exports
# `LANGUAGE_COMMONLISP: LanguageFn` (0.4.1 binds the const to the grammar name,
# not to `LANGUAGE`), ABI 14. SupportLang has no lisp variant, so no fallback
# route exists here either.
tree-sitter-commonlisp = { version = "0.4", optional = true }
# tree-sitter-rust 0.24.2 is ALREADY in this lock
# transitive, so the direct pin unifies to one copy and adds no grammar.
tree-sitter-rust = { version = "0.24", optional = true }
# tree-sitter-typescript ships BOTH the typescript and tsx grammars
# (LANGUAGE_TYPESCRIPT / LANGUAGE_TSX); tree-sitter-javascript covers .js/.jsx.
# One dep each for BOTH ts grammars; the plain-javascript grammar covers
# .js/.jsx.
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
# The `.scm` engine the Rust CallF defs run through: `#has-ancestor?`/`#has?`
# over a native tree-sitter query, one MatchArena per run.
hafley_scm = { path = "../hafley_scm", default-features = false }
# serde on the FLAT wire envelope only (never on the generic Node<F>). The store
# seam + the parity-golden normalize + the stdout JSONL all read this one shape.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
lsp-server = { version = "0.8", optional = true }
lsp-types = { version = "0.97", optional = true }
url = { version = "2", optional = true }
# basic-toml reads Cargo.toml for the package_edge arm. Candidates measured into
# THIS lock: basic-toml +1 crate (serde only, already here), toml 1.1 +4
# (toml_datetime/toml_parser/toml_writer/serde_spanned), cargo-manifest +14.
# A manifest read that fails degrades to no edges, so the TOML subset is enough:
# every Cargo.toml in this repository parses with it.
basic-toml = { version = "0.1", optional = true }
# gomod-parser reads go.mod for the same arm; its Replacement::FilePath vs
# ::Module split is exactly the workspace-local test. +2 crates (it and winnow);
# gomod-rs is +4 (nom, nom_locate, minimal-lexical, bytecount) for spans nothing
# here needs, and tree-sitter-gomod is a whole grammar for a line format.
gomod-parser = { version = "0.5", optional = true }
regex = { version = "1", optional = true }
# Repository/revision/path enumeration and Git batch reads live in the
# standalone hafley-rs crate. Extract consumes its source coordinates and bytes.
soopy = { path = "../soopy", optional = true }
# prost decodes index.scip for the ScipSource seam (commit 4c). v5's pairing
# (scip = "0.7.1" + protobuf = "3.7"; src/scip_import.rs) was REJECTED here:
# protobuf 3.7.2 hard-deps thiserror 1, a NEW dup against this tree's
# thiserror 2 (every scip crate version pins that runtime). prost + the
# vendored proto/scip.proto keeps the rails clean. The generated bindings are
# COMMITTED at src/scip/scip_proto.rs (the `scip` crate's own pattern): no
# build.rs, no build-time protoc. Regen: prost-build + protoc-bin-vendored
# over proto/scip.proto (run anywhere; diff the result against the committed
# file) - the prost-build route was measured to fork `cargo tree -d` with
# build-kind dup groups (bitflags/regex/prost via tempfile/prost-build).
prost = { version = "0.13", optional = true }
# @comment-ok: build-vs-buy candidate table, the law this file's every dep
# comment already carries.
# The read side of the dl6 store, behind `FactSet`. Same 0.40 pin and
# `bundled` build sprefa-engine-rs carries (its Cargo.toml:13), so one process
# linking both gets one SQLite. REJECTED: that crate's own `SqliteSeam`
# (run.rs:289) - it already depends on this one (its Cargo.toml:31), so reuse is
# a cycle; sprefa-store's sea-orm/sqlx reader - async, banned above the SqlRunner
# seam. `trace` is what the once-per-run statement count is measured on.
rusqlite = { version = "0.40", features = ["bundled", "limits", "trace", "vtab", "functions"], optional = true }
# Batch-local text offsets keep each value at 16 bytes. FxHasher fingerprints
# short strings; hashbrown's prehashed table compares bytes without rehashing.
rustc-hash = { version = "2", optional = true }
hashbrown = { version = "0.16", optional = true }
# Atomic, no-clobber publication of a CLI SQLite export. Reuses the tempfile
# version already in this lock through rust-analyzer; no custom temp-file protocol.
tempfile = { version = "3", optional = true }
# rayon drives the per-file extraction pool. A dedicated pool (never the global
# one) so nothing else in the process inherits the cap.
rayon = { version = "1", optional = true }
# The content-keyed extraction cache. Weight-bounded and concurrent (sharded,
# &self methods), so the rayon workers all hit it. Weight is an output estimate.
quick_cache = { version = "0.7", optional = true }
# tracing is the LIBRARY half only: spans and events, no subscriber. Same pair
# and versions the engine crate carries (sprefa-engine-rs/Cargo.toml:36-37), so
# one process linking both installs one subscriber that sees both crates.
tracing = { version = "0.1", optional = true }
hafley-observe = { path = "../hafley-observe", optional = true }
# getloadavg beside every timing, so a wall number reports the machine it was
# taken on. Already unified in this lock through soopy -> rustix -> errno.
libc = { version = "0.2", optional = true }

# clap is BIN-only: gated behind `cli` so `cargo tree --lib` stays free of it.
# The bin adds only clap; the lib never touches it.
[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.axum-extra]
version = "0.10"
features = ["query"]
optional = true

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs", "io-util"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.tokio-util]
version = "0.7"
features = ["codec", "io", "rt"]
optional = true

[dependencies.fs4]
version = "0.12"
optional = true

[dependencies.daemonize]
version = "0.5"
optional = true

[dependencies.base64]
version = "0.22"
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.http-body]
version = "1"
optional = true

# The subscriber is BIN-only for the same reason clap is: a library that installs
# a global subscriber steals the choice from whatever links it.
[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "json"]
optional = true

[features]
default = ["read", "graph"]
shared = [
    "hafley_scm/shared", "dep:memchr", "dep:ignore", "dep:globset", "dep:serde_json",
    "dep:regex", "dep:soopy", "dep:prost", "dep:rusqlite", "dep:rustc-hash",
    "dep:hashbrown", "dep:rayon", "dep:quick_cache", "dep:tracing",
]
rust = ["shared", "hafley_scm/rust", "hafley_scm/cargo-metadata", "dep:syn", "dep:proc-macro2", "dep:ra_ap_syntax", "dep:salsa", "dep:tree-sitter-rust"]
typescript = [
    "shared", "hafley_scm/typescript", "dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_ast",
    "dep:oxc_ast_visit", "dep:oxc_span", "dep:oxc_syntax", "dep:oxc_semantic",
    "dep:oxc_resolver", "dep:tree-sitter-typescript", "dep:tree-sitter-javascript",
]
go = ["shared", "hafley_scm/go", "dep:tree-sitter-go", "dep:gomod-parser"]
kotlin = ["shared", "hafley_scm/kotlin", "dep:tree-sitter-kotlin-sg", "dep:hafley_scm"]
python = ["shared", "hafley_scm/python", "dep:tree-sitter-python"]
prolog = ["shared", "hafley_scm/prolog", "dep:tree-sitter-prolog"]
graph = ["shared", "hafley_scm/graph"]
markdown = ["shared", "hafley_scm/markdown", "dep:tree-sitter-md"]
data = ["shared", "hafley_scm/data", "dep:tree-sitter-json", "dep:tree-sitter-yaml", "dep:tree-sitter-toml-ng", "dep:basic-toml"]
fallback = ["shared", "hafley_scm/fallback", "dep:tree-sitter-html"]
gdscript = ["shared", "hafley_scm/gdscript", "dep:tree-sitter-gdscript"]
commonlisp = ["shared", "hafley_scm/commonlisp", "dep:tree-sitter-commonlisp"]
typespec = ["shared", "hafley_scm/typespec"]
read = [
    "hafley_scm/read",
    "dep:lsp-server",
    "dep:lsp-types",
    "dep:url",
    "shared", "rust", "typescript", "go", "kotlin", "python", "prolog", "markdown",
    "data", "fallback", "gdscript", "commonlisp", "typespec",
]
cli = ["shared", "dep:ryi-proto", "hafley_scm/cli", "dep:clap", "dep:axum", "dep:axum-extra", "dep:tokio", "dep:tokio-util", "dep:futures-util", "dep:fs4", "dep:daemonize", "dep:base64", "dep:http-body-util", "dep:http-body", "dep:tracing-subscriber", "dep:hafley-observe", "dep:libc", "dep:tempfile", "rust-checker"]
profile-alloc = ["hafley-observe/span-alloc", "hafley-observe/rusage"]
# The rust checker tier: rust-analyzer as a library. Part of `cli` (user-set
# 2026-09-28); it pulls the whole rust-analyzer crate graph (380s cold build).
rust-checker = [
    "rust", "hafley_scm/rust-checker",
    "dep:ra_ap_hir",
    "dep:ra_ap_ide",
    "dep:ra_ap_ide_db",
    "dep:ra_ap_load-cargo",
    "dep:ra_ap_project_model",
    "dep:ra_ap_vfs",
]
# The ts checker tier, `--features cli,ts-checker`. Off by default and out of
# `cli`: it pulls no crate, but it makes every ts resolve able to spawn `node`.
ts-checker = ["typescript", "hafley_scm/ts-checker"]
# The go checker tier, `--features cli,go-checker`. Off by default and out of
# `cli` for the same reason as its ts twin: it pulls no crate, and it makes
# every go resolve able to spawn the `go` toolchain.
go-checker = ["go", "hafley_scm/go-checker"]

[[test]]
name = "all"
path = "tests/all.rs"

[[bin]]
name = "ryii"
path = "src/bin/ryi.rs"
required-features = ["cli", "read"]

# @comment-ok: build-vs-buy candidate table, the law this file's every dep
# comment carries. getrusage for the ratchet's peak-RSS row: libc is one
# syscall wrapper already unified in this lock (soopy -> rustix -> errno pins
# 0.2.189), so it adds no copy. REJECTED: `memory-stats` (+sysinfo on linux,
# mach-sysbindings on mac, a second copy of the same call behind its own
# types) and `sysinfo` (a whole process/CPU/NIC survey for one field).
[dev-dependencies]
libc = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
# The trail test reads back the two tables the bin wrote. Same pin and features
# as the dependency above, so cargo unifies one SQLite into the test binary.
rusqlite = { version = "0.40", features = ["bundled", "limits", "trace"] }

# The profile that 'dist' will build with
# Own workspace root, so the root dev profile does not reach here; deps
# (including out-of-dir path deps hafley_scm, soopy) build optimized once.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"
