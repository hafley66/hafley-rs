[package]
name = "concatmap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "agent pipe over resident chats: DL6-ready, not DL6-dependent"

[dependencies]
# The tmux multiplexer seam: one trait, one implementation in its own crate.
boop-mux = { version = "0.0.2", path = "../boop-mux" }
# The boop store read surface for visible turns (read-only SQL). Pipe state
# lives in worktree files, never in the store.
boop = { version = "0.0.2", path = "../boop" }
# Application-level errors; the pipe is a binary plus a testable library.
anyhow = "1"
# Rule files load as toml for v1; the fact/action shapes map onto DL6 relations
# later, so the loader is the only toml-specific seam.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# Process-wide diagnostics. The binary installs the subscriber; library code
# only emits conventional tracing events.
tracing.workspace = true
tracing-subscriber.workspace = true

[lib]
name = "concatmap"
path = "src/lib.rs"

[[bin]]
name = "concatmap"
path = "src/main.rs"
