[package]
name = "lab-20260920-scm-locals-vs-fast"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
sprefa-extract = { path = "../sprefa-extract", optional = true }
tree-sitter = "0.25"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-typescript = "0.23"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hafley-observe = { path = "../hafley-observe", default-features = false }
tracing = "0.1"

[features]
parse-query = ["dep:sprefa-extract"]
