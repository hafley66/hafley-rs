[workspace]
members = ["cargo:."]

# Config for 'dist'. Local-only: scripts/release.sh crates/ghcache builds on this Mac
# and uploads with gh. ghcache is its own workspace root (excluded from the parent),
# so its dist workspace lives here.
[dist]
cargo-dist-version = "0.32.0"
hosting = "github"
installers = ["shell"]
install-path = "CARGO_HOME"
install-updater = false
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
