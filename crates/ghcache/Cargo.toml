[package]
name = "ghcache"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hafley66/hafley-rs"
description = "local worktree cache and sync daemon for GitHub repositories"

# Own workspace root: without this table a git worktree under .claude/worktrees/
# walks up past the parent's `exclude`. Railed by sprefa-extract/tests/112_build_metadata.rs.
[workspace]

[[bin]]
name = "ghcache"
path = "src/main.rs"

[dependencies]
sqlx       = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio      = { version = "1",   features = ["full"] }
async-trait = "0.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
clap       = { version = "4", features = ["derive"] }
chrono     = { version = "0.4", features = ["serde"] }
dirs       = "6"
glob       = "0.3"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow     = "1"
inquire    = "0.7"
libc       = "0.2"
notify     = "6"

[dev-dependencies]
tempfile = "3"
