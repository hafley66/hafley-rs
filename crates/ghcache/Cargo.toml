[package]
name = "ghcache"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hafley66/hafley-rs"
description = "local worktree cache and sync daemon for GitHub repositories"

[[bin]]
name = "ghcache"
path = "src/main.rs"

[dependencies]
# sqlx main (4161768c): released 0.9.0 caps libsqlite3-sys below 0.38, and
# rusqlite 0.40 needs 0.38; one build links one libsqlite3-sys. Move to the
# next sqlx release that allows 0.38.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "4161768c9c077ea5dff6debcadeb0382d9f027df", features = ["runtime-tokio", "sqlite"] }
tokio      = { version = "1",   features = ["full"] }
async-trait = "0.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
clap       = { version = "4", features = ["derive"] }
chrono     = { version = "0.4", features = ["serde"] }
dirs       = "6"
glob       = "0.3"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow     = "1"
inquire    = "0.7"
libc       = "0.2"
notify     = "6"

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
dist = true
