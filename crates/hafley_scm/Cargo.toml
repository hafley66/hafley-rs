[package]
name = "hafley_scm"
version = "0.0.1"
edition = "2021"

[dependencies]
tree-sitter = "0.25"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "visit", "parsing", "extra-traits"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
ra_ap_syntax = { version = "0.0.349", optional = true }
ra_ap_mbe = { version = "0.0.349", optional = true }
ra_ap_tt = { version = "0.0.349", optional = true }
ra_ap_parser = { version = "0.0.349", optional = true }
ra_ap_span = { version = "0.0.349", optional = true }
ra_ap_syntax-bridge = { version = "0.0.349", optional = true }
salsa = { version = "=0.28.2", default-features = false, features = ["macros", "rayon"], optional = true }

# The read side (src/read/), behind `read`: sprefa-extract's pins, same lock.
memchr = { version = "2", optional = true }
ignore = { version = "0.4", optional = true }
oxc_allocator = { version = "0.135", optional = true }
oxc_parser = { version = "0.135", optional = true }
oxc_ast = { version = "0.135", optional = true }
oxc_ast_visit = { version = "0.135", optional = true }
oxc_span = { version = "0.135", optional = true }
oxc_syntax = { version = "0.135", optional = true }
oxc_semantic = { version = "0.135", optional = true }
oxc_resolver = { version = "11.24", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-kotlin-sg = { version = "0.4", optional = true }
tree-sitter-prolog = { version = "0.1", optional = true }
tree-sitter-json = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-gdscript = { version = "6", optional = true }
tree-sitter-commonlisp = { version = "0.4", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
serde_json = { version = "1", optional = true }
basic-toml = { version = "0.1", optional = true }
gomod-parser = { version = "0.5", optional = true }
regex = { version = "1", optional = true }
soopy = { path = "../soopy", optional = true }
prost = { version = "0.13", optional = true }
rusqlite = { version = "0.40", features = ["bundled", "limits", "trace"], optional = true }
rayon = { version = "1", optional = true }
quick_cache = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
# `cli`: the subscriber half of read/trace.rs.
hafley-observe = { path = "../hafley-observe", optional = true }
libc = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
# `rust-checker`: rust-analyzer's name resolution and inference.
ra_ap_hir = { version = "0.0.349", optional = true }
ra_ap_ide = { version = "0.0.349", optional = true }
ra_ap_ide_db = { version = "0.0.349", optional = true }
ra_ap_load-cargo = { version = "0.0.349", optional = true }
ra_ap_project_model = { version = "0.0.349", optional = true }
ra_ap_vfs = { version = "0.0.349", optional = true }

[features]
default = ["rust_syn"]
rust_syn = [
    "dep:syn",
    "dep:proc-macro2",
    "dep:ra_ap_syntax",
    "dep:ra_ap_mbe",
    "dep:ra_ap_tt",
    "dep:ra_ap_parser",
    "dep:ra_ap_span",
    "dep:ra_ap_syntax-bridge",
    "dep:salsa",
]

read = [
    "rust_syn",
    "dep:memchr", "dep:ignore",
    "dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_span",
    "dep:oxc_syntax", "dep:oxc_semantic", "dep:oxc_resolver",
    "dep:tree-sitter-go", "dep:tree-sitter-python", "dep:tree-sitter-kotlin-sg",
    "dep:tree-sitter-prolog", "dep:tree-sitter-json", "dep:tree-sitter-yaml",
    "dep:tree-sitter-toml-ng", "dep:tree-sitter-md", "dep:tree-sitter-html",
    "dep:tree-sitter-gdscript", "dep:tree-sitter-commonlisp", "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript", "dep:tree-sitter-javascript",
    "dep:serde_json", "dep:basic-toml", "dep:gomod-parser", "dep:regex", "dep:soopy",
    "dep:prost", "dep:rusqlite", "dep:rayon", "dep:quick_cache", "dep:tracing",
]
cli = ["read", "dep:hafley-observe", "dep:libc", "dep:tracing-subscriber"]
rust-checker = [
    "read",
    "dep:ra_ap_hir",
    "dep:ra_ap_ide",
    "dep:ra_ap_ide_db",
    "dep:ra_ap_load-cargo",
    "dep:ra_ap_project_model",
    "dep:ra_ap_vfs",
]
ts-checker = ["read"]
go-checker = ["read"]

[dev-dependencies]
tree-sitter-rust = "0.24"
