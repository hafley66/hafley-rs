[package]
name = "hafley_scm"
version = "0.0.1"
edition = "2021"

[dependencies]
tree-sitter = "0.27"
serde = { version = "1", features = ["derive"] }
syn = { version = "3", features = ["full", "visit", "parsing", "extra-traits"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
ra_ap_syntax = { version = "0.0.352", optional = true }
ra_ap_mbe = { version = "0.0.352", optional = true }
ra_ap_tt = { version = "0.0.352", optional = true }
ra_ap_parser = { version = "0.0.352", optional = true }
ra_ap_span = { version = "0.0.352", optional = true }
ra_ap_syntax-bridge = { version = "0.0.352", optional = true }
salsa = { version = "=0.28.2", default-features = false, features = ["macros", "rayon"], optional = true }

# The read side (src/read/), behind `read`: sprefa-extract's pins, same lock.
memchr = { version = "2", optional = true }
ignore = { version = "0.4", optional = true }
oxc_allocator = { version = "0.151", optional = true }
oxc_parser = { version = "0.151", optional = true }
oxc_ast = { version = "0.151", optional = true }
oxc_ast_visit = { version = "0.151", optional = true }
oxc_span = { version = "0.151", optional = true }
oxc_syntax = { version = "0.151", optional = true }
oxc_semantic = { version = "0.151", optional = true }
oxc_resolver = { version = "11.24.3", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-kotlin-sg = { version = "0.4", optional = true }
tree-sitter-prolog = { version = "0.1", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-gdscript = { version = "6", optional = true }
tree-sitter-commonlisp = { version = "0.4", optional = true }
tree-sitter-typespec = { path = "../tree-sitter-typespec", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
cargo_metadata = { version = "=0.23.1", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
serde_json = { version = "1", optional = true }
# Shared stock tsgo LSP/API transport; these pins already exist in sprefa-extract.
lsp-server = { version = "0.8", optional = true }
lsp-types = { version = "0.97", optional = true }
url = { version = "2", optional = true }
basic-toml = { version = "0.1", optional = true }
gomod-parser = { version = "0.5", optional = true }
regex = { version = "1", optional = true }
soopy = { path = "../soopy", optional = true }
prost = { version = "0.13", optional = true }
rusqlite = { version = "0.40", features = ["bundled", "limits", "trace"], optional = true }
rayon = { version = "1", optional = true }
quick_cache = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
petgraph = { version = "0.8.3", optional = true }
# `cli`: the subscriber half of read/trace.rs.
hafley-observe = { path = "../hafley-observe", optional = true }
libc = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
# `rust-checker`: rust-analyzer's name resolution and inference.
ra_ap_hir = { version = "0.0.352", optional = true }
ra_ap_ide = { version = "0.0.352", optional = true }
ra_ap_ide_db = { version = "0.0.352", optional = true }
ra_ap_cfg = { version = "0.0.352", optional = true }
ra_ap_intern = { version = "0.0.352", optional = true }
ra_ap_load-cargo = { version = "0.0.352", optional = true }
ra_ap_project_model = { version = "0.0.352", optional = true }
ra_ap_vfs = { version = "0.0.352", optional = true }

[features]
default = ["read", "graph"]
rust_syn = [
    "dep:syn",
    "dep:proc-macro2",
    "dep:ra_ap_syntax",
    "dep:ra_ap_mbe",
    "dep:ra_ap_tt",
    "dep:ra_ap_parser",
    "dep:ra_ap_span",
    "dep:ra_ap_syntax-bridge",
    "dep:salsa",
]

shared = [
    "dep:memchr", "dep:ignore",
    "dep:serde_json", "dep:regex", "dep:soopy", "dep:basic-toml",
    "dep:prost", "dep:rusqlite", "dep:rayon", "dep:quick_cache", "dep:tracing",
]
rust = ["shared", "rust_syn", "dep:tree-sitter-rust", "cargo-metadata"]
cargo-metadata = ["dep:cargo_metadata"]
typescript = [
    "shared", "dep:lsp-server", "dep:lsp-types", "dep:url",
    "dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_span",
    "dep:oxc_syntax", "dep:oxc_semantic", "dep:oxc_resolver",
    "dep:tree-sitter-typescript", "dep:tree-sitter-javascript",
]
go = ["shared", "dep:tree-sitter-go", "dep:gomod-parser"]
kotlin = ["shared", "dep:tree-sitter-kotlin-sg"]
python = ["shared", "dep:tree-sitter-python"]
prolog = ["shared", "dep:tree-sitter-prolog"]
# Petgraph is reserved for post-dominance and control-dependence queries that
# recursive SQLite CTEs do not express simply; graph reachability and paths
# remain SQL-backed.
graph = ["shared", "dep:petgraph"]
markdown = ["shared", "dep:tree-sitter-md"]
data = ["shared", "dep:tree-sitter-json", "dep:tree-sitter-yaml", "dep:tree-sitter-toml-ng", "dep:basic-toml"]
fallback = ["shared", "dep:tree-sitter-html"]
gdscript = ["shared", "dep:tree-sitter-gdscript"]
commonlisp = ["shared", "dep:tree-sitter-commonlisp"]
typespec = ["shared", "dep:tree-sitter-typespec"]
read = [
    "shared", "rust", "typescript", "go", "kotlin", "python", "prolog",
    "markdown", "data", "fallback", "gdscript", "commonlisp", "typespec",
]
cli = ["shared", "dep:hafley-observe", "dep:libc", "dep:tracing-subscriber"]
rust-checker = [
    "shared", "rust",
    "dep:ra_ap_hir",
    "dep:ra_ap_ide",
    "dep:ra_ap_ide_db",
    "dep:ra_ap_cfg",
    "dep:ra_ap_intern",
    "dep:ra_ap_load-cargo",
    "dep:ra_ap_project_model",
    "dep:ra_ap_vfs",
]
ts-checker = ["shared", "typescript"]
go-checker = ["shared", "go"]

[dev-dependencies]
tree-sitter-rust = "0.24"
tempfile = "3"
