[package]
name = "boop-mux"
version = "0.0.9"
edition.workspace = true
description = "the tmux multiplexer seam boop drives: one trait, one implementation over tmux_interface"
license.workspace = true

[dependencies]
# Application-level errors; the trait methods return these.
anyhow = "1"
# Layer 1: typed tmux command argv builder for the one-shot commands.
tmux_interface = "0.4"
# The terminal snapshot is the wire shape a host renders an overlay from, so it
# derives Serialize/Deserialize; field names are never renamed on the way out.
serde = { version = "1", features = ["derive"] }
# boop owns the subscriber; this library only emits operation boundaries.
tracing.workspace = true
