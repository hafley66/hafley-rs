[package]
name = "ryi"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[dependencies]
ryi-proto = { path = "../ryi-proto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-std", "io-util", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
