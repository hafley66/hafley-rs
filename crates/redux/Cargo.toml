[package]
name = "redux"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde-big-array = { version = "0.5.1", optional = true }

[features]
serde = ["dep:serde", "dep:serde-big-array"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "sync", "fs", "time"] }
tempfile = "3"
tracing = "0.1"
trybuild = "1"
statig = { version = "=0.4.1", default-features = false, features = ["serde"] }
