[package]
name = "sqlite-ext"
description = "Shared rusqlite extension callbacks, statement tracing, and transactional row collection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
loadable = ["rusqlite/loadable_extension", "rusqlite/functions"]

# No bundled SQLite here. A host that builds a loadable extension links the
# SQLite it is loaded into, and a bundled copy in a dependency links a second.
[dependencies]
rusqlite = { version = "=0.40.2", features = ["vtab"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hafley-observe = { path = "../hafley-observe" }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "vtab", "load_extension"] }
