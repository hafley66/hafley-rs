[package]
name = "lab-20260921-dead-files-bakeoff"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "lab-dead-files"
path = "src/2_main.rs"

[dependencies]
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sprefa-extract = { path = "../sprefa-extract", default-features = false }
