[package]
name = "soopy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Git revision and filesystem source enumeration, reading, and watching"

[dependencies]
anyhow = "1"
atomic-write-file = "0.3"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
diffy = { version = "0.5", features = ["std"] }
fs4 = "0.12"
globset = "0.4"
ignore = "0.4"
notify = { version = "8", features = ["macos_kqueue"] }
notify-debouncer-full = { version = "0.7", default-features = false, features = ["macos_kqueue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tracing.workspace = true
hafley-observe = { path = "../hafley-observe" }

[dev-dependencies]

[[bin]]
name = "soopy"
path = "src/main.rs"
