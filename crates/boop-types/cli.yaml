# generated by crates/boop-types/gen/cli_yaml.py from the installed binary
# every clap command path is a URL; every flag is a query parameter
openapi: 3.1.0
info:
  title: boop cli
  version: "boop 0.0.10 (25ad65f3)"
  description: "Reverse description of the clap tree. A path segment is a subcommand."
  license:
    name: "MIT OR Apache-2.0"
    identifier: "MIT OR Apache-2.0"
x-command-count: 113
servers:
  - url: boop
    description: "The installed binary; a path segment is a subcommand."
paths:
  "/":
    post:
      operationId: root
      summary: "Cross-harness agent transcript reader: drive agents with `beep`, read what they did with `db`"
      x-usage: "boop [OPTIONS] [COMMAND]"
      x-subcommands:
        - name: "shell-init"
          url: "/shell-init"
          summary: "Print shell functions that route interactive harnesses through Boop. Folded (one-pane-register-path): `boop tui <harness>` is the spelling"
        - name: "tui"
          url: "/tui"
          summary: "Launch an ordinary interactive harness TUI and register this pane"
        - name: "beep"
          url: "/beep"
          summary: "Mail a route and block for its answer; also the group that drives harnesses, lanes, agents and processes"
        - name: "db"
          url: "/db"
          summary: "Run raw SQL read-only against the store (the default `db` form), or read/count what agents did through a `db` subcommand"
        - name: "debug"
          url: "/debug"
          summary: "What just went wrong: recent WARN/ERROR across the lane trails and the store's error events, grouped by lane"
        - name: "agent"
          url: "/agent"
          summary: "Freshly synchronize and summarize Boop agent/runtime/activity facts"
        - name: "whoami"
          url: "/whoami"
          summary: "Report the caller's own identity and which of the two rungs named it"
        - name: "wait"
          url: "/wait"
          summary: "Block until mail lands: the reply to <id>, a lane's result row, or the next unread row addressed to you with --me"
        - name: "inbox"
          url: "/inbox"
          summary: "Mail a claude coordinator reads at a turn boundary: the hook inbox. Folded (door-only-claude-delivery): the hook inbox is a rung the delivery ladder walks on its own, not a verb a caller reaches for. The installed hook still calls `boop inbox drain`, so the group runs"
        - name: "me"
          url: "/me"
          summary: "The caller's own mood and favorite messages, the only verb for either. Registering a pane is `boop tui` / `boop beep agent register` now"
        - name: "tag"
          url: "/tag"
          summary: "The shared tag table: apply tags to any surface, read the recent five back. Search reads `agent_tag` only, never a message body"
        - name: "config"
          url: "/config"
          summary: "Inspect the boop configuration the CLI reads"
      parameters:
        - name: "--preset"
          in: query
          required: false
          description: "Run a persistent foreground ACP coordinator. Agent names such as `codex` work directly; model preset names resolve through config"
          schema: { type: string }
          x-clap: option
          x-value-name: "PRESET"
        - name: "--name"
          in: query
          required: false
          description: "Registry and ACPX session name for the foreground coordinator"
          schema: { type: string }
          x-clap: option
          x-value-name: "NAME"
        - name: "--mail-dir"
          in: query
          required: false
          description: "Mail registry for the foreground coordinator"
          schema: { type: string }
          x-clap: option
          x-value-name: "MAIL_DIR"
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/shell-init/{SHELL}":
    post:
      operationId: shell-init
      summary: "Print shell functions that route interactive harnesses through Boop. Folded (one-pane-register-path): `boop tui <harness>` is the spelling"
      x-usage: "boop shell-init <SHELL>"
      x-subcommands: []
      parameters:
        - name: "SHELL"
          in: path
          required: true
          description: "[possible values: bash]"
          schema: { type: string }
          x-clap: positional
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/tui/{HARNESS}":
    post:
      operationId: tui
      summary: "Launch an ordinary interactive harness TUI and register this pane"
      x-usage: "boop tui [OPTIONS] <HARNESS> [-- <ARGS>...]"
      x-subcommands: []
      parameters:
        - name: "HARNESS"
          in: path
          required: true
          description: "Registered harness adapter: claude, codex, kimi, or opencode"
          schema: { type: string }
          x-clap: positional
        - name: "ARGS"
          in: query
          required: false
          description: "Arguments forwarded to the ordinary harness TUI"
          schema: { type: array, items: { type: string } }
          x-clap: positional
        - name: "--bin"
          in: query
          required: false
          description: "Executable override, for example ccz with the Claude adapter"
          schema: { type: string }
          x-clap: option
          x-value-name: "EXECUTABLE"
        - name: "--name"
          in: query
          required: false
          description: "Stable route name for later resumes; refuses an existing live owner"
          schema: { type: string }
          x-clap: option
          x-value-name: "NAME"
        - name: "--cwd"
          in: query
          required: false
          description: ""
          schema: { type: string }
          x-clap: option
          x-value-name: "CWD"
        - name: "--mail-dir"
          in: query
          required: false
          description: ""
          schema: { type: string }
          x-clap: option
          x-value-name: "MAIL_DIR"
        - name: "--initial-prompt"
          in: query
          required: false
          description: "Submit once the native composer is ready (requires tmux)"
          schema: { type: string }
          x-clap: option
          x-value-name: "INITIAL_PROMPT"
        - name: "--initial-effort"
          in: query
          required: false
          description: "Apply an OpenCode variant before its first prompt"
          schema: { type: string }
          x-clap: option
          x-value-name: "INITIAL_EFFORT"
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep":
    post:
      operationId: beep
      summary: "Mail a route and block for its answer; also the group that drives harnesses, lanes, agents and processes. `boop beep <route> <body>` is the one send. `<route>` is a lane, a coordinator, a native, `parent` (the caller's own parent edge) or `children` (every live child of the caller). boop beep <COMMAND>"
      x-usage: "boop beep [OPTIONS] [ROUTE] [BODY]"
      x-subcommands:
        - name: "harness"
          url: "/beep/harness"
          summary: "Harness adapters and what each can do"
        - name: "lane"
          url: "/beep/lane"
          summary: "Lanes: the agents boop spawns and tracks"
        - name: "agent"
          url: "/beep/agent"
          summary: "Register pane-less coordinators and native subagents"
        - name: "message"
          url: "/beep/message"
          summary: "Mail across lanes; the one verb `ack` has no other spelling"
        - name: "fork"
          url: "/beep/fork"
          summary: "Fork a lane off a stored terminal comment: the quoted turns and the note become the brief, the lane runs on `--preset` from the caller's repo, and the link is kept in `agent_turn_comment_fork`. The `join` and `diff` verbs bring the fork back"
        - name: "paste"
          url: "/beep/paste"
          summary: "Put a file on the OS pasteboard and press the recipient's paste key in its pane, so a TUI that reads images off the pasteboard (claude, codex: Ctrl+V) takes the picture the way a hand paste would. Text and files the harness cannot read that way land as a quoted path instead"
        - name: "ps"
          url: "/beep/ps"
          summary: "pid, rss, cpu, uptime, child count per live lane"
        - name: "pstree"
          url: "/beep/pstree"
          summary: "Filesystem-style tree of lanes by parent edge. Folded (audit 2026-08-25): `beep lane list` carries the parent column"
        - name: "selection"
          url: "/beep/selection"
          summary: "Persistent recipient selection: list live harness panes, tick one route, record focus, or clear the set"
        - name: "shout"
          url: "/beep/shout"
          summary: "One row to every connected agent (live panes and registered pane-less routes), the caller excepted. The stop-gap broadcast"
        - name: "scream"
          url: "/beep/scream"
          summary: "Interrupt busy agents with one declared harness key before delivering the message. Idle and unknown TUIs take no keys; lanes take cancel rows"
      parameters:
        - name: "ROUTE"
          in: query
          required: false
          description: "A registry name, or the `parent` / `children` alias. Clap cannot mark this required: `subcommand_negates_reqs` does not clear a parent positional once a `beep` subcommand matches, so `beep lane list` would fail on a missing `<ROUTE>`. The dispatch raises clap's own missing-argument error instead."
          schema: { type: string }
          x-clap: positional
        - name: "BODY"
          in: query
          required: false
          description: "The message"
          schema: { type: string }
          x-clap: positional
        - name: "--as"
          in: query
          required: false
          description: "Who the row is from, when the whoami ladder cannot say"
          schema: { type: string }
          x-clap: option
          x-value-name: "NAME"
        - name: "--kind"
          in: query
          required: false
          description: "The mail kind the row wears [default: request]"
          schema: { type: string }
          x-clap: option
          x-value-name: "KIND"
        - name: "--timeout"
          in: query
          required: false
          description: "Seconds to block before exiting 124 [default: 540]"
          schema: { type: string }
          x-clap: option
          x-value-name: "TIMEOUT"
        - name: "--no-wait"
          in: query
          required: false
          description: "Send and return, instead of blocking for the answer"
          schema: { type: boolean }
          x-clap: flag
        - name: "--mail-dir"
          in: query
          required: false
          description: ""
          schema: { type: string }
          x-clap: option
          x-value-name: "MAIL_DIR"
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/harness":
    post:
      operationId: beep_harness
      summary: "Harness adapters and what each can do"
      x-usage: "boop beep harness <COMMAND>"
      x-subcommands:
        - name: "list"
          url: "/beep/harness/list"
          summary: ""
        - name: "get"
          url: "/beep/harness/get"
          summary: ""
      parameters: []
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/harness/list":
    post:
      operationId: beep_harness_list
      summary: "beep harness list"
      x-usage: "boop beep harness list"
      x-subcommands: []
      parameters: []
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/harness/get/{HARNESS}":
    post:
      operationId: beep_harness_get
      summary: "beep harness get"
      x-usage: "boop beep harness get <HARNESS>"
      x-subcommands: []
      parameters:
        - name: "HARNESS"
          in: path
          required: true
          description: ""
          schema: { type: string }
          x-clap: positional
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/lane":
    post:
      operationId: beep_lane
      summary: "Lanes: the agents boop spawns and tracks"
      x-usage: "boop beep lane <COMMAND>"
      x-subcommands:
        - name: "list"
          url: "/beep/lane/list"
          summary: "Every lane, with live or dead"
        - name: "create"
          url: "/beep/lane/create"
          summary: "Make a worktree, spawn the agent, register the route"
        - name: "revive"
          url: "/beep/lane/revive"
          summary: "Bring a dead `boop tui` coordinator pane back on its own session. Its route must carry harness, session_id and cwd; a live target refuses"
        - name: "get"
          url: "/beep/lane/get"
          summary: "One lane's route and state"
        - name: "where"
          url: "/beep/lane/where"
          summary: "The lane's worktree path alone, for `cd \"$(boop beep lane where x)\"`"
        - name: "patch"
          url: "/beep/lane/patch"
          summary: "Compatibility spelling for rebinding a registered route to an existing pane. Preserves its kind; fresh interactive registration uses agent register"
        - name: "delete"
          url: "/beep/lane/delete"
          summary: "Stop a lane and forget it, or bulk-delete by state"
        - name: "prune"
          url: "/beep/lane/prune"
          summary: "Drop routes whose tmux session is gone AND whose recorded pid, if any, is not alive. Refuses when tmux is unreachable"
        - name: "route"
          url: "/beep/lane/route"
          summary: "Which tmux pane and harness session id. Folded (audit 2026-08-25): `beep lane get` prints the same route row"
        - name: "pane"
          url: "/beep/lane/pane"
          summary: "Show the lane's screen"
        - name: "squares"
          url: "/beep/lane/squares"
          summary: "The user/agent squares on the lane's screen: one per visible turn, in screen order, each with the viewport rows it sits on. Reads the pane through the multiplexer and reports the pane's own geometry, so a renderer drawing the right-margin navigator asks one verb for both"
        - name: "message"
          url: "/beep/lane/message"
          summary: "The lane's mailbox"
      parameters: []
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/lane/list":
    post:
      operationId: beep_lane_list
      summary: "Every lane, with live or dead"
      x-usage: "boop beep lane list [OPTIONS]"
      x-subcommands: []
      parameters:
        - name: "--state"
          in: query
          required: false
          description: "Only lanes in this state: `live`, `idle`, `retired` or `dead`. `retired` lanes have left their pane on the idle shutdown and come back on `boop beep <lane> <body>`"
          schema: { type: string }
          x-clap: option
          x-value-name: "STATE"
        - name: "--harness"
          in: query
          required: false
          description: "Only lanes on this harness: claude, codex, opencode, kimi"
          schema: { type: string }
          x-clap: option
          x-value-name: "HARNESS"
        - name: "--all"
          in: query
          required: false
          description: "Include unregistered tmux sessions and native Claude subagents"
          schema: { type: boolean }
          x-clap: flag
        - name: "--socket"
          in: query
          required: false
          description: "Read liveness from this tmux socket; the default server when unset. Pane ids repeat across sockets, so a throwaway socket needs it"
          schema: { type: string }
          x-clap: option
          x-value-name: "SOCKET"
        - name: "--mail-dir"
          in: query
          required: false
          description: "Directory holding boop.db; defaults to ~/.agent"
          schema: { type: string }
          x-clap: option
          x-value-name: "MAIL_DIR"
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/lane/create":
    post:
      operationId: beep_lane_create
      summary: "Make a worktree, spawn the agent, register the route"
      x-usage: "boop beep lane create [OPTIONS]"
      x-subcommands: []
      parameters:
        - name: "--branch"
          in: query
          required: false
          description: "The lane's whole identity: `feature/<name>`, also fix/, refactor/, chore/. Lane id and tmux session are the branch with `/` as `-`"
          schema: { type: string }
          x-clap: option
          x-value-name: "BRANCH"
        - name: "--brief"
          in: query
          required: false
          description: "Absolute path to the brief the lane reads and executes"
          schema: { type: string }
          x-clap: option
          x-value-name: "BRIEF"
        - name: "--goal"
          in: query
          required: false
          description: "What the lane is running toward"
          schema: { type: string }
          x-clap: option
          x-value-name: "GOAL"
        - name: "--mood"
          in: query
          required: false
          description: "The format the lane's mail is rendered in; it inherits the parent's when absent"
          schema: { type: string }
          x-clap: option
          x-value-name: "MOOD"
        - name: "--trace"
          in: query
          required: false
          description: "Continue an existing trace instead of opening one named for the lane. Every session this lane runs joins it"
          schema: { type: string }
          x-clap: option
          x-value-name: "TRACE"
        - name: "--no-start"
          in: query
          required: false
          description: "Skip the repo's `boop-start` warmup in the new worktree"
          schema: { type: boolean }
          x-clap: flag
        - name: "--cwd"
          in: query
          required: false
          description: "Repo to branch from. Without it the brief's own repo wins, and only a brief outside any repo falls back to the caller's cwd"
          schema: { type: string }
          x-clap: option
          x-value-name: "CWD"
        - name: "--base-sha"
          in: query
          required: false
          description: "Defaults to origin/main's head, resolved and printed at spawn"
          schema: { type: string }
          x-clap: option
          x-value-name: "BASE_SHA"
        - name: "--expect-path"
          in: query
          required: false
          description: "A worktree-relative path that must exist for the lane to count as complete. Repeatable"
          schema: { type: string }
          x-clap: option
          x-value-name: "EXPECT_PATH"
        - name: "--expect-commit-subject"
          in: query
          required: false
          description: "An exact commit subject line that must appear in a commit after base_sha for the lane to count as complete. Repeatable"
          schema: { type: string }
          x-clap: option
          x-value-name: "EXPECT_COMMIT_SUBJECT"
        - name: "--expect-commits-at-least"
          in: query
          required: false
          description: "A lower bound on the commits after base_sha for the lane to count as complete"
          schema: { type: string }
          x-clap: option
          x-value-name: "EXPECT_COMMITS_AT_LEAST"
        - name: "--env"
          in: query
          required: false
          description: "An env var the lane's spawn inherits, `KEY=VAL`. Repeatable; each value is shell-quoted onto the supervisor's spawn command"
          schema: { type: string }
          x-clap: option
          x-value-name: "KEY=VAL"
        - name: "--commit-push"
          in: query
          required: false
          description: "How the lane's commits reach its parent: `door` or `mailbox`. Absent, the parent's kind picks the default"
          schema: { type: string }
          x-clap: option
          x-value-name: "MODE"
        - name: "--post-pr"
          in: query
          required: false
          description: "Finish by opening a PR: the lane brief closes with the push-and-PR line. Overrides a preset or global `post-pr`"
          schema: { type: boolean }
          x-clap: flag
        - name: "--no-post-pr"
          in: query
          required: false
          description: "Override a preset or global `post-pr` back off for this spawn"
          schema: { type: boolean }
          x-clap: flag
        - name: "--pr-base"
          in: query
          required: false
          description: "The branch `gh pr create --base` targets; default `main`"
          schema: { type: string }
          x-clap: option
          x-value-name: "BRANCH"
        - name: "--parent"
          in: query
          required: false
          description: "Defaults to the caller, then to the one registered coordinator"
          schema: { type: string }
          x-clap: option
          x-value-name: "PARENT"
        - name: "--on-parent-death"
          in: query
          required: false
          description: "What this lane does when its parent route stops answering Possible values: - kill:     End the lane the way a stall kill does, reporting `parent-died` - reparent: Rewrite the parent edge onto the one registered coordinator, keep going - orphan:   Keep running with the dead edge, which is what every spawn did before the policy existed [default: orphan]"
          schema: { type: string }
          x-clap: option
          x-value-name: "ON_PARENT_DEATH"
        - name: "--preset"
          in: query
          required: false
          description: "The row of the config preset table this lane spawns from: harness, model, effort. The one model spelling `lane create` takes"
          schema: { type: string }
          x-clap: option
          x-value-name: "PRESET"
        - name: "--variant"
          in: query
          required: false
          description: "opencode reasoning-effort variant (low|medium|high); CLI wins over the preset's variant, and opencode's default applies when neither"
          schema: { type: string }
          x-clap: option
          x-value-name: "VARIANT"
        - name: "--bin"
          in: query
          required: false
          description: "Run the harness as this executable instead of its own binary (`ccz` is claude under the z.ai env). CLI wins over the preset's `bin`; the harness's own binary applies when neither names one"
          schema: { type: string }
          x-clap: option
          x-value-name: "BIN"
        - name: "--wait-timeout"
          in: query
          required: false
          description: "Seconds `--wait` blocks before exiting 124; 0 waits forever [default: 3600]"
          schema: { type: string }
          x-clap: option
          x-value-name: "WAIT_TIMEOUT"
        - name: "--lane"
          in: query
          required: false
          description: "Overrides the lane id derived from `--branch`"
          schema: { type: string }
          x-clap: option
          x-value-name: "LANE"
        - name: "--tmux"
          in: query
          required: false
          description: "Overrides the tmux session name derived from `--branch`"
          schema: { type: string }
          x-clap: option
          x-value-name: "TMUX"
        - name: "--socket"
          in: query
          required: false
          description: "tmux socket to spawn on; a throwaway socket for tests, `None` for the default server"
          schema: { type: string }
          x-clap: option
          x-value-name: "SOCKET"
        - name: "--mail-dir"
          in: query
          required: false
          description: "Directory holding boop.db; defaults to ~/.agent"
          schema: { type: string }
          x-clap: option
          x-value-name: "MAIL_DIR"
        - name: "--dry-run"
          in: query
          required: false
          description: "Print the worktree, branch, base sha and the literal `cmd:` line without spawning"
          schema: { type: boolean }
          x-clap: flag
        - name: "--reclaim"
          in: query
          required: false
          description: "Folded (dead-lane-self-reset): a dead name is reset on every create, so this is a no-op alias kept for old scripts"
          schema: { type: boolean }
          x-clap: flag
      responses:
        "200": { description: success, x-exit-code: 0 }
        "400": { description: clap parse error, x-exit-code: 2 }
  "/beep/lane/revive":
    post:
      operationId: beep_lane_revive
      summary: "Bring a dead `boop tui` coordinator pane back on its own session. Its route must carry harness, session_id and cwd; a live target refuses"
      x-usage: "boop beep lane revive [OPTIONS] [LANE]"
      x-subcommands: []
      parameters:
        - name: "LANE"
          in: query
          required: false
          description: "The dead route to revive. Omit for `--dead` or `--list`"
          schema: { type: string }
          x-clap: positional
        - name: "--dead"
          in: query
          required: false
          description: "The turnkey command after a tmux server death: print one table of dead coordinator routes, then ask which to revive"
          schema: { type: boolean }
          x-clap: flag
        - name: "--list"
          in: query
          required: false
          description: "Print that table and exit; the read path, no prompt, no spawn"
          schema: { type: boolean }
          x-clap: flag
        - name: "--json"
          in: query
          required: false
          description: "`--list` as JSON, uncut, for a reader that draws its own table"
          schema: { type: boolean }
          x-clap: flag
        - name: "--yes"
          in: query
          required: false
          description: "Skip the prompt and revive every row"
          schema: { type: boolean }
          x-clap: flag
          x-short: "-y"
        - name: "--since"
          in: query
          required: false
          description: "Only routes active this recently: Ns, Nm, Nh [default: 1h]"
          schema: { type: string }
          x-clap: option
          x-value-name: "SINCE"
        - name: "--socket"
          in: query
          required: false
          description: "tmux socket the pane lives on; the default server when unset"
          schema: { type: string }
          x-clap: option
          x-value-name: "SOCKET"
        - name: "--mail-dir"
          in: query
          required: false
