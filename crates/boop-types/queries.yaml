      x-sql: "CREATE TABLE IF NOT EXISTS agent_mail (   seq INTEGER PRIMARY KEY AUTOINCREMENT,   message_id TEXT NOT NULL UNIQUE,   mailbox TEXT NOT NULL DEFAULT 'bus',   from_route TEXT NOT NULL,   to_route TEXT NOT NULL,   from_timestamp TEXT NOT NULL,   to_timestamp TEXT,   kind TEXT NOT NULL,   reply_to TEXT,   body TEXT NOT NULL,   ref_id TEXT,   rc INTEGER,   detail TEXT ); CREATE INDEX IF NOT EXISTS idx_mail_to ON agent_mail(to_route, seq); CREATE INDEX IF NOT EXISTS idx_mail_from ON agent_mail(from_route, seq);  CREATE TRIGGER IF NOT EXISTS agent_mail_needs_transition BEFORE INSERT ON agent_mail WHEN NOT EXISTS (   SELECT 1 FROM agent_delivery_transition WHERE message_id = NEW.message_id ) BEGIN   SELECT RAISE(ABORT, 'agent_mail row without a delivery transition'); END;  -- How far each legacy file beside the database has been read. `offset` is the -- byte the next ndjson tail read starts at; `digest` is the last registry.json -- content a merge ran against. The files are never renamed or removed, so a -- `boop` that predates the mailbox keeps appending beside a `boop` that tails. CREATE TABLE IF NOT EXISTS mail_import (   path TEXT PRIMARY KEY,   offset INTEGER NOT NULL DEFAULT 0,   digest TEXT NOT NULL DEFAULT '' ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS agent_route (   route TEXT PRIMARY KEY,   kind TEXT NOT NULL DEFAULT 'lane',   harness TEXT,   tmux TEXT,   cwd TEXT,   model TEXT,   mode TEXT,   session_id TEXT,   source_path TEXT,   parent TEXT,   goal TEXT,   registered_at TEXT,   base_sha TEXT,   worktree_dir TEXT,   app_server_socket TEXT ) WITHOUT ROWID;"
