      summary: "CREATE VIEW IF NOT EXISTS v_usage_cost AS SELECT usage.session_id,        usage.turn,        usage.ts,        "
      x-sql: "CREATE VIEW IF NOT EXISTS v_usage_cost AS SELECT usage.session_id,        usage.turn,        usage.ts,        dict_session.value AS session,        dict_harness.value AS harness,        dict_model.value AS model,        usage.input_tokens,        usage.output_tokens,        usage.cache_create_5m_tokens,        usage.cache_create_1h_tokens,        usage.cache_read_tokens,        usage.is_sidechain,        COALESCE(usage.cost_usd_recorded,                 (usage.input_tokens * price.input_per_mtok                  + usage.output_tokens * price.output_per_mtok                  + usage.cache_create_5m_tokens * price.cache_write_5m_per_mtok                  + usage.cache_create_1h_tokens * price.cache_write_1h_per_mtok                  + usage.cache_read_tokens * price.cache_read_per_mtok) / 1e6) AS cost_usd FROM agent_usage AS usage JOIN agent_session ON agent_session.session_id = usage.session_id JOIN dict_session ON dict_session.id = agent_session.session_id JOIN dict_harness ON dict_harness.id = agent_session.harness_id JOIN dict_model ON dict_model.id = usage.model_id LEFT JOIN model_price AS price ON price.model_id = usage.model_id;  CREATE VIEW IF NOT EXISTS v_skill_cost_act AS SELECT dict_skill.value AS skill,        v_usage_cost.session AS session,        v_usage_cost.harness AS harness,        v_usage_cost.turn AS act_turn,        v_usage_cost.ts AS ts,        v_usage_cost.model AS model,        v_usage_cost.input_tokens,        v_usage_cost.output_tokens,        v_usage_cost.cache_read_tokens,        v_usage_cost.cost_usd FROM agent_skill JOIN dict_skill ON dict_skill.id = agent_skill.skill_id JOIN v_usage_cost ON v_usage_cost.session_id = agent_skill.session_id                  AND v_usage_cost.turn = agent_skill.turn;  CREATE VIEW IF NOT EXISTS v_skill_cost_window AS WITH act AS (   SELECT agent_skill.session_id AS session_id,          agent_skill.skill_id AS skill_id,          agent_skill.turn AS act_turn,          (SELECT MIN(agent_turn.turn) FROM agent_turn           WHERE agent_turn.session_id = agent_skill.session_id             AND agent_turn.role_id = (SELECT id FROM dict_role WHERE value = 'user')             AND agent_turn.turn > agent_skill.turn) AS next_user_turn   FROM agent_skill ) SELECT dict_skill.value AS skill,        dict_session.value AS session,        act.act_turn,        act.next_user_turn,        COUNT(v_usage_cost.turn) AS usage_rows,        CAST(TOTAL(v_usage_cost.is_sidechain) AS INTEGER) AS sidechain_rows,        CAST(TOTAL(v_usage_cost.input_tokens) AS INTEGER) AS input_tokens,        CAST(TOTAL(v_usage_cost.output_tokens) AS INTEGER) AS output_tokens,        TOTAL(v_usage_cost.cost_usd) AS cost_usd FROM act JOIN dict_skill ON dict_skill.id = act.skill_id JOIN dict_session ON dict_session.id = act.session_id LEFT JOIN v_usage_cost ON v_usage_cost.session_id = act.session_id                       AND v_usage_cost.turn >= act.act_turn                       AND v_usage_cost.turn < COALESCE(act.next_user_turn, 1000000000) GROUP BY act.session_id, act.skill_id;"
