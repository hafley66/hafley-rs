      x-sql: "CREATE TABLE IF NOT EXISTS dict_session (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_harness (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_cwd (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_branch (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_role (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_path (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_verb (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_program (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_url (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_domain (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_netkind (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_skill (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_pr (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_edekind (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_agenttype (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_status (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_pane (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_model (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_service_tier (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_price_source (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_record (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE);  -- request_id is NOT NULL with '' for absent: SQLite treats NULLs in a UNIQUE -- index as distinct, and 8.4% of measured records carry no requestId. CREATE TABLE IF NOT EXISTS dict_request (   id INTEGER PRIMARY KEY,   message_id TEXT NOT NULL,   request_id TEXT NOT NULL DEFAULT '',   UNIQUE (message_id, request_id) );  CREATE TABLE IF NOT EXISTS dict_trace (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_attach (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_trace_kind (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_trace_delivery (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_trace_classification (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE);  CREATE TABLE IF NOT EXISTS markdown_cache (   markdown_id INTEGER PRIMARY KEY,   digest TEXT NOT NULL UNIQUE,   body TEXT NOT NULL,   bytes INTEGER NOT NULL,   first_ts INTEGER NOT NULL );  -- User-pinned markdown, the one user-authored state in the store: no -- transcript re-projects it, so rebuild() carries it across the drop by value. -- source is plain text (a session id, a url, whatever the user typed), never a -- dict id, so re-import needs no id remap. CREATE TABLE IF NOT EXISTS agent_favorite (   favorite_id INTEGER PRIMARY KEY,   markdown_id INTEGER NOT NULL,   note TEXT,   source TEXT NOT NULL DEFAULT '',   created_ts INTEGER NOT NULL );  -- User-authored comment on terminal output, second user-authored state after -- agent_favorite. `quote` is the slice as read off the screen; `note` is what -- the reader wants done with it. `client_id` is the UI's item id and the -- upsert key, so a re-sent edit converges instead of duplicating. `sent_ts` -- set means the comment went into a prompt; it stays as history and stops -- rehydrating. A slice that overlapped no turn keeps only `tab_name`. CREATE TABLE IF NOT EXISTS agent_turn_comment (   comment_id INTEGER PRIMARY KEY,   client_id TEXT NOT NULL UNIQUE,   kind TEXT NOT NULL DEFAULT 'selection',   quote TEXT NOT NULL,   note TEXT,   enabled INTEGER NOT NULL DEFAULT 1,   tab_name TEXT,   created_ts INTEGER NOT NULL,   updated_ts INTEGER NOT NULL,   sent_ts INTEGER );  -- The turns a comment quotes, any role: user turns are targets exactly like -- assistant turns. user-authored, carried across a rebuild by session text -- because session_id is a dict id the re-sync hands out afresh. CREATE TABLE IF NOT EXISTS agent_turn_comment_target (   comment_id INTEGER NOT NULL,   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   PRIMARY KEY (comment_id, session_id, turn) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_turn_comment_target   ON agent_turn_comment_target(session_id, turn);  -- One lane forked off a stored comment (`boop beep fork <comment-id>`): the -- quoted turns and the note became the lane's brief, so the row is -- user-authored. A terminal paints it back under the quoted turn. CREATE TABLE IF NOT EXISTS agent_turn_comment_fork (   comment_id INTEGER NOT NULL,   lane TEXT NOT NULL,   branch TEXT NOT NULL,   brief TEXT NOT NULL,   created_ts INTEGER NOT NULL,   PRIMARY KEY (comment_id, lane) ) WITHOUT ROWID;  -- One row per tag, user-authored: the count and last use the recent list -- orders by. `boop tag search` reads this column, never a message body. CREATE TABLE IF NOT EXISTS agent_tag (   tag TEXT PRIMARY KEY,   created_ts INTEGER NOT NULL,   last_used_ts INTEGER NOT NULL,   uses INTEGER NOT NULL DEFAULT 0 ) WITHOUT ROWID;  -- What a user-authored tag hangs on. `source` is plain text every surface -- spells the same way ('favorite:<id>', 'comment:<id>', 'lane:<name>'), never -- a dict id, so a caller can link a thing the store has no table for. CREATE TABLE IF NOT EXISTS agent_tag_link (   tag TEXT NOT NULL,   source TEXT NOT NULL,   ts INTEGER NOT NULL,   PRIMARY KEY (tag, source) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_tag_link_source ON agent_tag_link(source);  -- One subscriber's interest in a lane's commits. `lane` is a lane name or -- '*'; `mode` is how a push reaches the subscriber. The exact (subscriber, -- lane) row beats the (subscriber, '*') row. CREATE TABLE IF NOT EXISTS agent_commit_subscription (   subscriber TEXT NOT NULL,   lane TEXT NOT NULL,   mode TEXT NOT NULL CHECK (mode IN ('door', 'mailbox')),   created_at TEXT NOT NULL,   PRIMARY KEY (subscriber, lane) ) WITHOUT ROWID;  -- One push of one commit to one subscriber: the dedupe key that keeps a -- drained or retried row from taking a door twice for the same head. CREATE TABLE IF NOT EXISTS agent_commit_push (   lane TEXT NOT NULL,   subscriber TEXT NOT NULL,   head TEXT NOT NULL,   message_id TEXT NOT NULL,   at_ms INTEGER NOT NULL,   PRIMARY KEY (lane, subscriber, head) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_commit_push_subscriber   ON agent_commit_push(subscriber, at_ms);  -- The last head a lane reported, so a supervisor restart or revive does not -- report the same commit twice. CREATE TABLE IF NOT EXISTS agent_lane_head (   lane TEXT PRIMARY KEY,   reported_head TEXT NOT NULL,   at_ms INTEGER NOT NULL ) WITHOUT ROWID;  -- One row per PR url, claimed by the first producer that sees it. The claim is -- what keeps the supervisor and transcript ingest from appending two rounds. CREATE TABLE IF NOT EXISTS agent_pr_notice (   pr_url TEXT PRIMARY KEY,   lane TEXT NOT NULL,   at_ms INTEGER NOT NULL ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS agent_trace (   trace_id INTEGER PRIMARY KEY,   root_session_id INTEGER,   started_ts INTEGER NOT NULL );  CREATE TABLE IF NOT EXISTS agent_trace_span (   session_id INTEGER PRIMARY KEY,   trace_id INTEGER NOT NULL,   attach_id INTEGER NOT NULL,   attached_ts INTEGER NOT NULL ); CREATE INDEX IF NOT EXISTS idx_span_trace ON agent_trace_span(trace_id);  CREATE TABLE IF NOT EXISTS agent_lane (   spawn_id INTEGER PRIMARY KEY,   lane_id INTEGER NOT NULL,   trace_id INTEGER,   harness_id INTEGER,   branch_id INTEGER,   cwd_id INTEGER,   model_id INTEGER,   parent_lane_id INTEGER,   goal TEXT,   brief_path_id INTEGER,   brief_markdown_id INTEGER,   spawned_ts INTEGER NOT NULL ); CREATE INDEX IF NOT EXISTS idx_lane_trace ON agent_lane(trace_id); CREATE INDEX IF NOT EXISTS idx_lane_lane ON agent_lane(lane_id, spawned_ts);  CREATE TABLE IF NOT EXISTS agent_trace_event (   event_id INTEGER PRIMARY KEY,   event_key TEXT NOT NULL UNIQUE,   lane_id INTEGER NOT NULL REFERENCES dict_session(id),   trace_id INTEGER REFERENCES dict_trace(id),   session_id INTEGER REFERENCES dict_session(id),   from_lane_id INTEGER REFERENCES dict_session(id),   to_lane_id INTEGER REFERENCES dict_session(id),   kind_id INTEGER NOT NULL REFERENCES dict_trace_kind(id),   started_ts INTEGER,   finished_ts INTEGER,   delivery_state_id INTEGER REFERENCES dict_trace_delivery(id),   classification_id INTEGER REFERENCES dict_trace_classification(id),   detail TEXT NOT NULL DEFAULT '',   created_ts INTEGER NOT NULL ); CREATE INDEX IF NOT EXISTS idx_trace_event_lane_time   ON agent_trace_event(lane_id, created_ts, event_id); CREATE INDEX IF NOT EXISTS idx_trace_event_trace_time   ON agent_trace_event(trace_id, created_ts, event_id);  CREATE TABLE IF NOT EXISTS agent_session (   session_id INTEGER PRIMARY KEY,   harness_id INTEGER NOT NULL,   nickname TEXT,   cwd_id INTEGER,   branch_id INTEGER,   started_ts INTEGER ); CREATE INDEX IF NOT EXISTS idx_session_cwd ON agent_session(cwd_id);  CREATE TABLE IF NOT EXISTS agent_turn (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   ts INTEGER,   role_id INTEGER NOT NULL,   said TEXT,   cwd_id INTEGER,   PRIMARY KEY (session_id, turn) ) WITHOUT ROWID; -- A covering (session_id, ts) index: MAX(ts) per session answers from the -- index btree alone, never reading the wide `said` payload from the table row. -- The primary key still owns turn-order reads; this only serves the activity -- aggregate. CREATE INDEX IF NOT EXISTS idx_turn_session_ts ON agent_turn(session_id, ts);  -- The directory one turn ran in, falling back to the session's cwd when the -- turn records none (kimi/opencode and legacy rows before schema v27). Readers -- resolve relative refs against this instead of the session-wide cwd. CREATE VIEW IF NOT EXISTS v_turn_cwd AS SELECT t.session_id,        t.turn,        cwd.value AS cwd   FROM agent_turn t   JOIN agent_session s ON s.session_id = t.session_id   LEFT JOIN dict_cwd cwd ON cwd.id = COALESCE(t.cwd_id, s.cwd_id);  CREATE TABLE IF NOT EXISTS agent_touch (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   ts INTEGER,   path_id INTEGER NOT NULL,   verb_id INTEGER NOT NULL,   raw_verb_id INTEGER,   PRIMARY KEY (session_id, turn, path_id, verb_id) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_touch_pathid ON agent_touch(path_id);  CREATE TABLE IF NOT EXISTS agent_cmd (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   ts INTEGER,   program_id INTEGER NOT NULL,   argline TEXT,   PRIMARY KEY (session_id, turn) ) WITHOUT ROWID;  -- One row per outbound network act. A search has no url or domain and a fetch -- has no query; `query` is payload text, never a key. CREATE TABLE IF NOT EXISTS agent_fetch (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   ts INTEGER,   kind_id INTEGER NOT NULL,   url_id INTEGER,   domain_id INTEGER,   query TEXT,   PRIMARY KEY (session_id, turn) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_fetch_ts ON agent_fetch(ts);  CREATE TABLE IF NOT EXISTS agent_skill (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   skill_id INTEGER NOT NULL,   PRIMARY KEY (session_id, turn) ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS agent_pr (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   pr_url_id INTEGER NOT NULL,   PRIMARY KEY (session_id, turn, pr_url_id) ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS agent_span (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   path_id INTEGER NOT NULL,   line_start INTEGER,   line_end INTEGER,   PRIMARY KEY (session_id, turn, path_id) ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS agent_edge (   parent_session_id INTEGER NOT NULL,   child_session_id INTEGER NOT NULL,   edge_kind_id INTEGER NOT NULL,   agent_type_id INTEGER,   model_id INTEGER,   first_ts INTEGER,   last_ts INTEGER,   n INTEGER NOT NULL DEFAULT 1,   PRIMARY KEY (parent_session_id, child_session_id, edge_kind_id) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_edge_child ON agent_edge(child_session_id, edge_kind_id);  CREATE TABLE IF NOT EXISTS agent_usage (   session_id INTEGER NOT NULL,   turn INTEGER NOT NULL,   ts INTEGER NOT NULL,   request_ref INTEGER NOT NULL,   model_id INTEGER NOT NULL,   service_tier_id INTEGER,   input_tokens INTEGER NOT NULL DEFAULT 0,   output_tokens INTEGER NOT NULL DEFAULT 0,   cache_create_5m_tokens INTEGER NOT NULL DEFAULT 0,   cache_create_1h_tokens INTEGER NOT NULL DEFAULT 0,   cache_read_tokens INTEGER NOT NULL DEFAULT 0,   is_sidechain INTEGER NOT NULL DEFAULT 0,   cost_usd_recorded REAL,   PRIMARY KEY (session_id, turn) ) WITHOUT ROWID; CREATE UNIQUE INDEX IF NOT EXISTS idx_usage_request ON agent_usage(request_ref); CREATE INDEX IF NOT EXISTS idx_usage_ts ON agent_usage(ts); CREATE INDEX IF NOT EXISTS idx_usage_model_ts ON agent_usage(model_id, ts);  -- Rates are USD per MILLION tokens: LiteLLM's per-token values are readable -- only when scaled, and REAL keeps the precision either way. CREATE TABLE IF NOT EXISTS model_price (   model_id INTEGER PRIMARY KEY,   input_per_mtok REAL NOT NULL,   output_per_mtok REAL NOT NULL,   cache_write_5m_per_mtok REAL NOT NULL,   cache_write_1h_per_mtok REAL NOT NULL,   cache_read_per_mtok REAL NOT NULL,   source_id INTEGER NOT NULL,   fetched_ts INTEGER NOT NULL );  -- door_kind and door_addr are the address a hail is delivered to: the -- harness's own control plane, as its LiveSessions pass observed it. Both -- stay TEXT: an address is payload, never a JOIN key. CREATE TABLE IF NOT EXISTS agent_live (   session_id INTEGER PRIMARY KEY,   pid INTEGER,   tmux_pane_id INTEGER,   status_id INTEGER,   door_kind TEXT,   door_addr TEXT );  -- One row per hail put in front of a recipient: what the door answered, keyed -- on the message and the route it was addressed to, so a re-delivery of the -- same message to the same route overwrites rather than piles up. `detail` -- carries an Unreachable reason and is '' for every other outcome. CREATE TABLE IF NOT EXISTS agent_delivery (   message_id TEXT NOT NULL,   route TEXT NOT NULL,   harness_id INTEGER,   outcome TEXT NOT NULL,   detail TEXT NOT NULL DEFAULT '',   at_ms INTEGER NOT NULL,   PRIMARY KEY (message_id, route) ) WITHOUT ROWID;  -- The current-state ledger above keeps the latest outcome per route. This -- child table is the append-only receipt history for every handoff. CREATE TABLE IF NOT EXISTS agent_delivery_transition (   message_id TEXT NOT NULL,   sequence INTEGER NOT NULL,   route TEXT NOT NULL,   harness_id INTEGER,   outcome TEXT NOT NULL,   detail TEXT NOT NULL DEFAULT '',   error_code TEXT,   at_ms INTEGER NOT NULL,   PRIMARY KEY (message_id, sequence) ) WITHOUT ROWID; CREATE INDEX IF NOT EXISTS idx_delivery_transition_route   ON agent_delivery_transition(message_id, route);  -- One row per door budget trip (failure mode 14, rail 2): a route was about -- to take more door pushes inside `window_ms` than its live connects allow. -- The newest row for a route holds every door push at it until -- `at_ms + cooldown_ms`. CREATE TABLE IF NOT EXISTS agent_door_blowout (   blowout_id INTEGER PRIMARY KEY,   route TEXT NOT NULL,   at_ms INTEGER NOT NULL,   pushes INTEGER NOT NULL,   budget INTEGER NOT NULL,   window_ms INTEGER NOT NULL,   cooldown_ms INTEGER NOT NULL,   why TEXT NOT NULL DEFAULT '' ); CREATE INDEX IF NOT EXISTS idx_door_blowout_route   ON agent_door_blowout(route, at_ms);  -- The reply to a sent comment: the first assistant turn in the target -- session after the target turn, stamped no earlier than the send. Nothing -- links a comment to its answer on the wire, so the answer is read back off -- agent_turn here. A pending comment has no row; a sent one whose reply is -- not ingested yet reads reply_turn NULL. CREATE VIEW IF NOT EXISTS agent_turn_comment_reply AS SELECT c.comment_id,        t.session_id,        t.turn AS target_turn,        (SELECT MIN(a.turn)           FROM agent_turn a           JOIN dict_role r ON r.id = a.role_id          WHERE a.session_id = t.session_id            AND a.turn > t.turn            AND r.value = 'assistant'            AND (a.ts IS NULL OR a.ts >= c.sent_ts)) AS reply_turn   FROM agent_turn_comment c   JOIN agent_turn_comment_target t ON t.comment_id = c.comment_id  WHERE c.sent_ts IS NOT NULL;  -- Historical liveness: [from_ts, to_ts) intervals, open when to_ts IS NULL, -- folded from observations so a state change closes an interval and repeated -- identical observations extend nothing. CREATE TABLE IF NOT EXISTS agent_live_span (   session_id INTEGER NOT NULL,   from_ts INTEGER NOT NULL,   to_ts INTEGER,   status_id INTEGER NOT NULL,   pid INTEGER,   tmux_pane_id INTEGER,   PRIMARY KEY (session_id, from_ts) ) WITHOUT ROWID;  CREATE INDEX IF NOT EXISTS idx_live_span_open ON agent_live_span(session_id, to_ts);  CREATE TABLE IF NOT EXISTS sync_cursor (   session_id INTEGER NOT NULL,   path_id INTEGER NOT NULL,   offset INTEGER NOT NULL,   record_id_id INTEGER,   turn INTEGER NOT NULL DEFAULT 0,   timestamp INTEGER NOT NULL DEFAULT 0,   modified_ms INTEGER NOT NULL DEFAULT 0,   projection_version INTEGER NOT NULL DEFAULT 0,   PRIMARY KEY (session_id, path_id) ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS sync_root_stamp (   harness_id INTEGER NOT NULL,   root_path_id INTEGER NOT NULL,   mtime_ms INTEGER NOT NULL,   PRIMARY KEY (harness_id, root_path_id) ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS dict_attr_key (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS dict_mood_name (id INTEGER PRIMARY KEY, value TEXT NOT NULL UNIQUE);  CREATE TABLE IF NOT EXISTS agent_session_attr (   session_id INTEGER NOT NULL,   key_id INTEGER NOT NULL,   value TEXT NOT NULL,   set_ts INTEGER NOT NULL,   PRIMARY KEY (session_id, key_id) ) WITHOUT ROWID;  CREATE TABLE IF NOT EXISTS mood (   id INTEGER PRIMARY KEY,   name_id INTEGER NOT NULL UNIQUE,   template TEXT NOT NULL );"
