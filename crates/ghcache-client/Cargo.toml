[package]
name = "ghcache-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hafley66/hafley-rs"
description = "Read-only typed client for the ghcache SQLite database"

# Own workspace root: without this table a git worktree under .claude/worktrees/
# walks up past the parent's `exclude`. Railed by sprefa-extract/tests/112_build_metadata.rs.
[workspace]

[dependencies]
sqlx    = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio   = { version = "1",   features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
