<h3>Tree / code query languages (2026-10-03)</h3>

<script>const data=[{"tool": "servo selectors (CSS)", "data_model": "DOM element tree via Element trait", "query_unit": "selector, matched right-to-left per element", "field_access": "attributes only ([attr=x]); no child-role names", "relations": "descendant, child, sibling (+ ~), :has, :nth-child, :not", "recursion": "none", "multi_capture": "no captures; match yes/no per element", "cross_language": "n/a (one DOM)", "runtime": "in-process Rust, per element"}, {"tool": "esquery", "data_model": "ESTree AST (JavaScript only)", "query_unit": "CSS-selector string over AST nodes", "field_access": "field selector: MemberExpression.callee, attribute [name=x] on node props", "relations": "descendant, child, sibling, :has, :nth-child, :not, :matches", "recursion": "none", "multi_capture": "no captures; returns matched nodes", "cross_language": "no (ESTree only)", "runtime": "in-process JS (ESLint selectors)"}, {"tool": "tree-sitter .scm", "data_model": "tree-sitter CST per language", "query_unit": "fixed-shape S-expression pattern", "field_access": "field: name inside pattern (function: (identifier))", "relations": "parent/child by nesting; sibling quantifiers + * ?; anchors .", "recursion": "none (quantifiers repeat siblings, not depth)", "multi_capture": "many named captures per match", "cross_language": "per-language grammar, no shared schema", "runtime": "in-process (C core), one cursor pass"}, {"tool": "ast-grep", "data_model": "tree-sitter CST per language", "query_unit": "code-snippet pattern with $META; YAML rule (kind/pattern/regex)", "field_access": "field: on relational rules", "relations": "inside, has, precedes, follows with stopBy (neighbor/end/rule); all/any/not/matches", "recursion": "no transitive closure over a relation", "multi_capture": "single $X and multi $$$X metavariables; one match per rule hit", "cross_language": "per-language patterns, no shared schema", "runtime": "in-process Rust, parallel per file"}, {"tool": "GritQL", "data_model": "tree-sitter CST per language", "query_unit": "code-snippet pattern in backticks with $vars; <: match operator", "field_access": "field access on AST nodes in patterns", "relations": "contains, within, until, bubble, sequential, and/or/not", "recursion": "named pattern definitions can be recursive", "multi_capture": "metavariables, lists ($list) with list patterns", "cross_language": "per-language snippets, no shared schema", "runtime": "in-process Rust (marzano), per file; rewrites with =>"}, {"tool": "CodeQL", "data_model": "relational database per language from compiler extraction", "query_unit": "QL predicates and classes", "field_access": "typed getters (getCallee, getQualifier)", "relations": "any relation as a predicate", "recursion": "transitive closure + * and recursive predicates", "multi_capture": "select tuples of any arity", "cross_language": "no: separate library per language", "runtime": "JVM, whole-database evaluation"}, {"tool": "scm++ (ryi, today)", "data_model": "tree-sitter CST rows in SQLite: interned dict ids, preorder node ranges", "query_unit": "nested .scm levels compiled to flat .scm + one SQL", "field_access": "field: on the step next to the target; field id on node rows", "relations": "has, has-ancestor, has-parent, precedes, follows, nth-child + of, not-, stopBy; cross-level #eq?/#match?", "recursion": "none (range joins, no recursion)", "multi_capture": "rows: first / each; quantified captures as cartesian rows", "cross_language": "per-language patterns; rows can emit TSI", "runtime": "in-process Rust + SQLite (DuckDB benched)"}, {"tool": "sprefa over TSI (planned)", "data_model": "TSI relations (tsi.called, tsi.argument, tsi.has_type ...) from every language", "query_unit": "Datalog rules", "field_access": "relation arguments", "relations": "any TSI relation, joins", "recursion": "recursive rules (closure, chains, custom pointer rules)", "multi_capture": "rule heads of any arity", "cross_language": "yes: shared relation names", "runtime": "Rust native or SQLite evaluator"}];const cols=["tool", "data_model", "query_unit", "field_access", "relations", "recursion", "multi_capture", "cross_language", "runtime"];
$(function(){$('#g').DataTable({data,paging:false,columns:cols.map(c=>({data:c,title:c}))});});</script></body></html>
