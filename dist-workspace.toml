[workspace]
members = ["cargo:."]

# Config for 'dist'. Local-only: scripts/release.sh <crate-dir> builds on this Mac
# and uploads with gh. crates/sprefa-extract and crates/ghcache have their own.
[dist]
cargo-dist-version = "0.32.0"
hosting = "github"
installers = ["shell"]
install-path = "CARGO_HOME"
install-updater = false
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Only packages that opt in via [package.metadata.dist] dist = true.
dist = false
