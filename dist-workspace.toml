[workspace]
members = ["cargo:."]

# Config for 'dist'. Local-only: no CI backend, because .github/workflows/release.yml
# belongs to crates/sprefa-extract's own dist workspace. Releases are built on an
# arm64 Mac with `dist build --tag=<pkg>-vX.Y.Z` and uploaded with `gh release`.
[dist]
cargo-dist-version = "0.32.0"
hosting = "github"
installers = ["shell"]
install-path = "CARGO_HOME"
install-updater = false
targets = ["aarch64-apple-darwin"]
# Only packages that opt in via [package.metadata.dist] dist = true.
dist = false
