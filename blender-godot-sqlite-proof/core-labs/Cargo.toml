[workspace]
resolver = "3"

[package]
name = "core-labs"
version = "0.1.0"
edition = "2024"

[dependencies]
ggrs = "0.13.0"
glam_ozz = { package = "glam", version = "0.30.9", features = ["core-simd", "libm"], optional = true }
ozz-animation-rs = { version = "0.11.0", optional = true }
parry3d = "0.30.2"
rapier3d = { version = "0.35.3", features = ["serde-serialize", "enhanced-determinism"] }
rusqlite = { version = "0.40.2", features = ["bundled", "vtab"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[features]
ozz = ["dep:glam_ozz", "dep:ozz-animation-rs"]
