[workspace]
resolver = "3"

[package]
name = "falcon-lab"
version = "0.1.0"
edition = "2024"
default-run = "falcon-lab"

[dependencies]
brawllib_rs = "=0.29.0"
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
cgmath = "0.18"
serde_json = "1"
parry3d = "=0.30.2"
wgpu = "=29.0.4"
pollster = "=0.4.0"
font8x8 = "0.3"
ggrs = "=0.13.0"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "falcon-lab"
path = "2_main.rs"

[[bin]]
name = "falcon-rollback"
path = "8_rollback.rs"
