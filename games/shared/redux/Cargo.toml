[workspace]

[package]
name = "redux"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde-big-array = { version = "0.5.1", optional = true }

[features]
serde = ["dep:serde", "dep:serde-big-array"]

[dev-dependencies]
serde_json = "1"
