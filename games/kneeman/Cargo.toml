[package]
name = "kneeman"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
redux = { path = "../../crates/redux" }
smash_rollback = { package = "rollback", path = "../../crates/rollback" }
game_input = { package = "input", path = "../../crates/input" }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-big-array = "0.5.1"
parry2d = "0.29"
blake3 = "1"
bitflags = { version = "2", features = ["serde"] }
ggrs = "0.13"
bincode = "1.3"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"], optional = true }
matchbox_socket = { version = "0.14", optional = true }

[features]
storage = ["dep:rusqlite"]
matchbox = ["dep:matchbox_socket"]
wasm = ["matchbox", "ggrs/wasm-bindgen"]
