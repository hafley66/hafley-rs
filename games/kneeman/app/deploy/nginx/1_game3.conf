# Include separately in the existing TLS server block. The /game/ snippet stays intact.
location = /game3 {
    return 301 /game3/;
}

location = /game3/ {
    rewrite ^ /game3/index.html last;
}

location /game3/ {
    alias /var/www/smash-godot-game3/;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript application/json;
    types {
        text/html html htm;
        text/css css;
        text/javascript js;
        application/json json;
        application/wasm wasm;
        image/png png;
        image/x-icon ico;
        application/octet-stream pck;
    }
}
