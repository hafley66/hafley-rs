[workspace]

[package]
name = "game-fighter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
redux = { path = "../redux", features = ["serde"] }
game-input = { path = "../input" }
statig = { version = "=0.4.1", default-features = false, features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "ground_chart"
path = "examples/0_ground_chart.rs"
