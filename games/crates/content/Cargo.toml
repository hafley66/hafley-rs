[workspace]
resolver = "3"

[package]
name = "game-content"
version = "0.1.0"
edition = "2024"

[features]
ingest = ["dep:brawllib_rs", "dep:base64", "dep:bincode", "dep:tracing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
brawllib_rs = { version = "=0.29.0", optional = true }
base64 = { version = "0.22", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
tracing = { version = "=0.1.44", optional = true }

[dev-dependencies]
serde_json = "1"
