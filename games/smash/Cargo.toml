[workspace]
resolver="3"
[package]
name="smash"
version="0.1.0"
edition="2024"
[lib]
path="src/lib.rs"
[dependencies]
redux = { path = "../crates/redux" }
game-input = { path = "../crates/input" }
serde={version="1",features=["derive"]}
serde_json="1"
tracing="=0.1.44"
parry3d="=0.30.2"
rapier3d={version="=0.35.3",features=["serde-serialize","enhanced-determinism"]}
ssbm_utils="=0.4.0"
