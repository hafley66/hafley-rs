[workspace]
resolver="3"
[package]
name="smash"
version="0.1.0"
edition="2024"

[features]
ingest = ["game-content/ingest", "dep:brawllib_rs"]

[lib]
path="src/lib.rs"

[[bin]]
name = "smash-import"
path = "src/3_import.rs"
required-features = ["ingest"]

[[example]]
name = "status_export"
path = "examples/0_status_export.rs"
[dependencies]
game-content = { path = "../crates/content" }
redux = { path = "../crates/redux" }
game-input = { path = "../crates/input" }
game-fighter = { path = "../crates/fighter" }
serde={version="1",features=["derive"]}
serde_json="1"
tracing="=0.1.44"
parry3d="=0.30.2"
rapier3d={version="=0.35.3",features=["serde-serialize","enhanced-determinism"]}
ssbm_utils="=0.4.0"
brawllib_rs={version="=0.29.0",optional=true}

[dev-dependencies]
sha2="0.10"
