[package]
name = "physics2d"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic 2D integration, Rapier solver state, contacts, and Parry-compatible geometry values"
publish = false

[dependencies]
glam = { version = "0.30", features = ["serde"] }
rapier2d = { version = "0.34", features = ["enhanced-determinism", "serde-serialize"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[[example]]
name = "ccd_one_way_probe"
path = "examples/0_ccd_one_way_probe.rs"
